project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - "*.qmd"
    - "procurement/*.qmd"
    - "procurement/insights/*.qmd"
    - "id/*.qmd"
    - "!README.md"
    # Held back until the first essay is written — an index of unwritten pieces
    # reads worse than no page at all. To publish: delete this line and restore
    # the "Insights" section at the foot of procurement/index.qmd.
    - "!procurement/insights.qmd"
    # Same reason as insights.qmd above: held back until the first essay.
    - "!id/tulisan.qmd"

website:
  title: "Billy Tulungen"
  description: "Economist, researcher, and public procurement expert. PhD candidate in Economics, Universitas Indonesia."
  site-url: "https://billytulungen.com"
  favicon: assets/img/favicon.png
  open-graph: true
  twitter-card: false

  navbar:
    title: "Billy Tulungen"
    pinned: false
    # No "Home" entry: the brand at the left already links home, and dropping it
    # keeps the bar from reading like an institutional site.
    left:
      - href: research.qmd
        text: Research
      - href: procurement/index.qmd
        text: Public Procurement
      - href: teaching.qmd
        text: Teaching
      # Professional stays a page but leaves the bar: it overlaps Public
      # Procurement enough that a reader could not tell which to click. It is
      # linked from Public Procurement, the CV, and About.
      - href: cv.qmd
        text: CV
      - href: about.qmd
        text: About
    right:
      - href: id/index.qmd
        text: "Bahasa Indonesia"

  page-footer:
    left: |
      © 2026 Billy Tulungen
    center: |
      [Email](mailto:billy.thandy21@ui.ac.id) &middot;
      [Google Scholar](https://scholar.google.com/citations?user=LchRWJsAAAAJ) &middot;
      [ORCID](https://orcid.org/0000-0001-5480-1426) &middot;
      [LinkedIn](https://www.linkedin.com/in/billytulungen) &middot;
      [X](https://x.com/billythandy)
    right: |
      Built with [Quarto](https://quarto.org)

  page-navigation: false
  back-to-top-navigation: false
  search: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false

execute:
  freeze: auto
  echo: false
  warning: false
